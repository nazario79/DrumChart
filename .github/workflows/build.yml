name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Chiave di firma
        run: base64 -d app/drumchart.jks.b64 > app/drumchart.jks

      - name: Compila APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk DrumChart-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DrumChart-apk
          path: DrumChart-*.apk

      - name: Pubblica in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DrumChart build ${{ github.run_number }}
          files: DrumChart-*.apk
