name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Chiave di firma
        run: base64 -d app/drumchart.jks.b64 > app/drumchart.jks

      - name: Compila APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease 2>&1 | tee build.log

      - name: Salva log errori
        if: failure()
        run: |
          grep -nE "^e: |error:|FAILURE|What went wrong|Exception" -A4 build.log > errors.txt || true
          cp build.log /tmp/build.log; cp errors.txt /tmp/errors.txt
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rqf --cached .
          cp /tmp/build.log /tmp/errors.txt .
          git add -f build.log errors.txt
          git commit -qm "Log build ${{ github.run_number }}"
          git push -f origin build-log

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk DrumChart-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DrumChart-apk
          path: DrumChart-*.apk

      - name: Pubblica in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DrumChart build ${{ github.run_number }}
          files: DrumChart-*.apk
